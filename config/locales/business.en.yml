        short_description: "Repairs, modifications, and smart storage add-ons"
        hero_heading: "Upgrades & Repairs That Make Your Cabinets Work"
        hero_subheading: "Repairs, custom modifications, and accessories — everything your cabinets need to work at their best."
        icon: "adjustments"
        details:
