          - "Modify existing cabinets for new appliances or build custom for your space"
          - "Add roll-out trays, drawers, trash pull-outs, spice racks, and more to new or existing cabinets"
      custom_closets:
        name: "Custom Closets & Pantries"
        short_description: "Custom spaces tailored to you"
        description: "Custom spaces tailored to you and your life's accessories."
        hero_heading: "Custom Storage Built Exactly to Your Space"
        hero_subheading: "Closet and pantry systems designed, built, and installed — tailored to you and your life's accessories."
        icon: "template"
