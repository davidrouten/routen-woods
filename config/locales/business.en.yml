    faq:
      - question: "How long does cabinet refacing take?"
        answer: "Most cabinet refacing projects are completed within a week — a fraction of the time a full kitchen rebuild would take. We work efficiently to minimize disruption to your daily routine."
      - question: "What's the difference between refacing and replacing cabinets?"
        answer: "Refacing keeps your existing cabinet boxes and replaces the doors, drawer fronts, and surface finish. You get a completely new look at a fraction of the cost and time of full replacement — and with far less mess and disruption."
      - question: "What door styles do you offer?"
        answer: "We offer a wide variety of styles in 3DL, 5-piece profile-wrapped, and melamine materials — from contemporary slabs to ornate raised panels to simple shakers. There's a fit for any kitchen."
      - question: "What areas do you serve?"
        answer: "We proudly serve Oxford, Michigan and surrounding areas including Lake Orion, Auburn Hills, Rochester, and Clarkston."
      - question: "Do you offer free estimates?"
        answer: "Yes! We offer free, no-obligation in-home consultations where we assess your cabinets and provide a detailed quote."

