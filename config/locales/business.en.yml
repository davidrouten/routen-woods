      steps:
        consultation:
          number: "01"
          title: "Free Consultation"
          description: "We visit your home, assess your cabinets, and discuss your vision. No pressure, no obligation — just honest advice on what'll work best for your space."
        preparation:
          number: "02"
          title: "Expert Preparation"
          description: "Meticulous measuring and surface preparation, followed by applying high-quality laminate finish to your cabinet boxes. We offer a wide variety of door styles in 3DL, 5-piece profile-wrapped, and melamine materials — from contemporary slabs to ornate raised panels to simple shakers."
        transformation:
          number: "03"
          title: "The Transformation"
          description: "Your new doors and drawer fronts are installed, and your existing cabinet boxes are relaminated to match. Most jobs are completed within a week — not the months you'd wait for a full kitchen rebuild."
        reveal:
          number: "04"
          title: "The Big Reveal"
          description: "Final walkthrough, quality inspection, and your jaw-dropping kitchen reveal. We don't leave until you love it."

