    services:
      cabinet_refacing:
        name: "Cabinet Refacing"
        short_description: "New doors, new finish, same great bones"
        description: "Our signature service. We replace your cabinet doors and drawer fronts with your choice of style — from contemporary slabs to ornate raised panels to simple shakers — then relaminate the existing cabinet boxes to match. A complete kitchen transformation, typically finished within a week instead of the months a full rebuild takes."
        icon: "door-open"
      cabinet_customization:
        name: "Cabinet Customization & Accessories"
        short_description: "Make your cabinets work harder for you"
        description: "Upgrade your kitchen with custom rollout trays, spice racks, lazy susans, and other accessories that turn wasted cabinet space into smart storage. Simple additions that make a big difference in how your kitchen functions day to day."
        icon: "adjustments"
      cabinet_repair:
        name: "Cabinet Repair"
        short_description: "Fix what's broken, save what's good"
        description: "From stripped screws and broken drawer boxes to water-damaged sides and face frames, we handle the repairs other companies won't touch. We can replace drawer sides, rebuild damaged sections, or custom-frame around new appliances like dishwashers — whatever it takes to get your cabinets solid again."
        icon: "wrench"
      cabinet_repainting:
        name: "Cabinet Repainting"
        short_description: "A fresh coat for a fresh look"
        description: "Want a specific color or need to match new doors? We offer a white-glove cabinet repainting solution — your cabinets are professionally finished and returned looking factory-new. Perfect when refacing isn't the right fit but your cabinets still have great bones."
        icon: "paint-roller"
      cabinet_installation:
        name: "Cabinet Installation"
        short_description: "Professional installs by a licensed builder"
        description: "Need new cabinets installed? We handle the full installation — something most refacing companies can't offer because it requires a builder's license. Whether you're adding cabinets to a new space or replacing old ones entirely, we do the job right."
        icon: "hammer"
      custom_closets:
        name: "Custom Closets & Pantries"
        short_description: "Custom storage that transforms your space"
        description: "Full custom closet and pantry systems designed and installed to fit your space perfectly. There's nothing quite like seeing a cluttered closet or bare pantry turned into an organized, beautiful storage solution built exactly to your needs."
        icon: "template"
      countertops:
        name: "Countertops"
        short_description: "Premade, laminate, or custom — we do it all"
        description: "Complete your kitchen transformation with new countertops. We offer premade, laminate, solid surface, and custom wood options — a service most refacing companies won't touch. Pair with a refacing project for a seamless, coordinated result."
        icon: "table"

